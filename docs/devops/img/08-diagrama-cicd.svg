<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" font-family="Segoe UI, Arial, sans-serif" fill="#1f2937">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="seta-erro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="350" fill="#ffffff"/>

  <!-- Linha 1: site (repositório público) -->
  <text x="20" y="22" font-size="13" font-weight="700">Repositório ecocoleta_app (público): site</text>

  <rect x="20" y="50" width="130" height="96" rx="8" fill="#eef6f0" stroke="#16A34A" stroke-width="1.5"/>
  <text x="85" y="88" text-anchor="middle" font-size="12" font-weight="700">Eu</text>
  <text x="85" y="106" text-anchor="middle" font-size="11">git push na main</text>

  <rect x="168" y="34" width="376" height="178" rx="10" fill="#f8fafc" stroke="#9ca3af" stroke-dasharray="6 4"/>
  <text x="180" y="50" font-size="11" fill="#4b5563">GitHub Actions · runner ubuntu-latest</text>

  <rect x="182" y="60" width="150" height="76" rx="6" fill="#ffffff" stroke="#334155"/>
  <text x="257" y="82" text-anchor="middle" font-size="12" font-weight="700">job testes</text>
  <text x="257" y="101" text-anchor="middle" font-size="11">flutter analyze</text>
  <text x="257" y="118" text-anchor="middle" font-size="11">flutter test</text>

  <rect x="380" y="60" width="150" height="76" rx="6" fill="#ffffff" stroke="#334155"/>
  <text x="455" y="80" text-anchor="middle" font-size="12" font-weight="700">job deploy</text>
  <text x="455" y="97" text-anchor="middle" font-size="11">zip da pasta site/</text>
  <text x="455" y="113" text-anchor="middle" font-size="11">API da Netlify</text>
  <text x="455" y="129" text-anchor="middle" font-size="11">curl confere o site</text>

  <rect x="580" y="50" width="160" height="96" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="660" y="82" text-anchor="middle" font-size="12" font-weight="700">Netlify</text>
  <text x="660" y="101" text-anchor="middle" font-size="11">ecocoleta-app</text>
  <text x="660" y="118" text-anchor="middle" font-size="11">.netlify.app</text>

  <line x1="150" y1="98" x2="180" y2="98" stroke="#334155" stroke-width="1.5" marker-end="url(#seta)"/>
  <line x1="332" y1="98" x2="378" y2="98" stroke="#16A34A" stroke-width="1.5" marker-end="url(#seta)"/>
  <text x="355" y="90" text-anchor="middle" font-size="10" fill="#15803d">passou</text>
  <line x1="530" y1="98" x2="578" y2="98" stroke="#334155" stroke-width="1.5" marker-end="url(#seta)"/>
  <text x="560" y="90" text-anchor="middle" font-size="10" fill="#4b5563">token</text>

  <line x1="257" y1="136" x2="257" y2="158" stroke="#dc2626" stroke-width="1.5" marker-end="url(#seta-erro)"/>
  <text x="265" y="151" font-size="10" fill="#dc2626">falhou</text>
  <rect x="182" y="160" width="348" height="40" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="356" y="184" text-anchor="middle" font-size="11">O deploy não roda e o site continua na versão anterior</text>

  <!-- Linha 2: API (repositório privado) -->
  <text x="20" y="248" font-size="13" font-weight="700">Repositório da API (privado)</text>

  <rect x="20" y="262" width="130" height="70" rx="8" fill="#eef6f0" stroke="#16A34A" stroke-width="1.5"/>
  <text x="85" y="292" text-anchor="middle" font-size="12" font-weight="700">Eu</text>
  <text x="85" y="310" text-anchor="middle" font-size="11">git push na main</text>

  <rect x="182" y="262" width="150" height="70" rx="6" fill="#ffffff" stroke="#334155"/>
  <text x="257" y="284" text-anchor="middle" font-size="12" font-weight="700">job verificar</text>
  <text x="257" y="302" text-anchor="middle" font-size="11">npm ci</text>
  <text x="257" y="318" text-anchor="middle" font-size="11">node --check</text>

  <rect x="380" y="262" width="150" height="70" rx="6" fill="#ffffff" stroke="#334155"/>
  <text x="455" y="284" text-anchor="middle" font-size="12" font-weight="700">job deploy</text>
  <text x="455" y="302" text-anchor="middle" font-size="11">deploy hook</text>
  <text x="455" y="318" text-anchor="middle" font-size="11">curl confere a API</text>

  <rect x="580" y="262" width="160" height="70" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="660" y="284" text-anchor="middle" font-size="12" font-weight="700">Render</text>
  <text x="660" y="302" text-anchor="middle" font-size="11">npm install + npm start</text>
  <text x="660" y="318" text-anchor="middle" font-size="11">→ Firestore</text>

  <line x1="150" y1="297" x2="180" y2="297" stroke="#334155" stroke-width="1.5" marker-end="url(#seta)"/>
  <line x1="332" y1="297" x2="378" y2="297" stroke="#16A34A" stroke-width="1.5" marker-end="url(#seta)"/>
  <line x1="530" y1="297" x2="578" y2="297" stroke="#334155" stroke-width="1.5" marker-end="url(#seta)"/>
</svg>
