<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Segoe UI, Arial, sans-serif" fill="#1f2937">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="seta-erro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="380" fill="#ffffff"/>

  <!-- Acesso direto bloqueado -->
  <path d="M95,62 V24 H650 V58" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#seta-erro)"/>
  <text x="372" y="17" text-anchor="middle" font-size="11" fill="#dc2626">acesso direto ao banco: negado pelas Security Rules</text>

  <!-- Clientes -->
  <rect x="20" y="62" width="150" height="70" rx="8" fill="#eef6f0" stroke="#16A34A" stroke-width="1.5"/>
  <text x="95" y="92" text-anchor="middle" font-size="12" font-weight="700">Celular</text>
  <text x="95" y="110" text-anchor="middle" font-size="11">app Flutter (APK)</text>

  <rect x="20" y="240" width="150" height="70" rx="8" fill="#eef6f0" stroke="#16A34A" stroke-width="1.5"/>
  <text x="95" y="270" text-anchor="middle" font-size="12" font-weight="700">Navegador</text>
  <text x="95" y="288" text-anchor="middle" font-size="11">qualquer pessoa</text>

  <!-- Render -->
  <rect x="270" y="50" width="200" height="110" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="370" y="74" text-anchor="middle" font-size="12" font-weight="700">Render · Web Service Free</text>
  <text x="370" y="94" text-anchor="middle" font-size="11">API Node.js + Express</text>
  <text x="370" y="111" text-anchor="middle" font-size="11">HTTPS na 443 → porta PORT</text>
  <text x="370" y="128" text-anchor="middle" font-size="11">chave em Secret File</text>
  <text x="370" y="145" text-anchor="middle" font-size="11">sem SSH, disco efêmero</text>

  <!-- Netlify e GitHub -->
  <rect x="270" y="210" width="200" height="60" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="370" y="235" text-anchor="middle" font-size="12" font-weight="700">Netlify</text>
  <text x="370" y="253" text-anchor="middle" font-size="11">site estático (pasta site/)</text>

  <rect x="270" y="295" width="200" height="60" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="370" y="320" text-anchor="middle" font-size="12" font-weight="700">GitHub Releases</text>
  <text x="370" y="338" text-anchor="middle" font-size="11">app-release.apk</text>

  <!-- Firestore -->
  <rect x="560" y="58" width="180" height="104" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="650" y="82" text-anchor="middle" font-size="12" font-weight="700">Firebase</text>
  <text x="650" y="99" text-anchor="middle" font-size="12" font-weight="700">Cloud Firestore</text>
  <text x="650" y="118" text-anchor="middle" font-size="11">southamerica-east1</text>
  <text x="650" y="135" text-anchor="middle" font-size="11">plano Spark</text>
  <text x="650" y="152" text-anchor="middle" font-size="11">usuarios · coletas</text>

  <!-- Fluxos -->
  <line x1="170" y1="100" x2="268" y2="100" stroke="#334155" stroke-width="1.5" marker-end="url(#seta)"/>
  <text x="219" y="92" text-anchor="middle" font-size="10" fill="#4b5563">HTTPS 443</text>

  <line x1="470" y1="105" x2="558" y2="105" stroke="#334155" stroke-width="1.5" marker-end="url(#seta)"/>
  <text x="514" y="97" text-anchor="middle" font-size="10" fill="#4b5563">HTTPS 443</text>
  <text x="514" y="122" text-anchor="middle" font-size="10" fill="#4b5563">service account</text>

  <line x1="170" y1="262" x2="268" y2="245" stroke="#334155" stroke-width="1.5" marker-end="url(#seta)"/>
  <text x="214" y="243" text-anchor="middle" font-size="10" fill="#4b5563">HTTPS</text>

  <line x1="170" y1="290" x2="268" y2="322" stroke="#334155" stroke-width="1.5" marker-end="url(#seta)"/>
  <text x="206" y="322" text-anchor="middle" font-size="10" fill="#4b5563">baixar APK</text>
</svg>
